name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e . pytest
      # The committed index is the one the page serves; the build must reproduce it from the manifest's hashes.
      - run: python -m guide_rag build
      - run: git diff --stat --exit-code -- index/coverage.json index/corpus_index.json index/line_df.json index/toc_df.json || (echo "the index drifted from the committed one" && exit 1)
      - run: python -m pytest -o addopts="" -q
      # The quote-fidelity gate is inside eval (100 % or exit 1); the ok rate per type is reported, the total gated at 90 %.
      - run: python -m guide_rag eval --fail-under 0.9
