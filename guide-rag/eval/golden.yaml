# The golden set (SPEC §6): real questions over this corpus, labelled by type, with where the guide
# answers them (doc_id, section ids or titles, optionally a line range) or `absent` / `clarify`.
# Lines were read in index/line_df.json when the set was written; sections are checked by id or title.
version: 1
questions:
