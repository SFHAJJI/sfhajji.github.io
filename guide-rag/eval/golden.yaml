  - {id: g01, type: factual, question: "combien de temps pour déclarer son arrivée à la commune",
     expected: {doc_id: arrivee, sections: [arrivee#s1, arrivee#s2]}}
  - {id: g02, type: factual, question: "quelle classe d'impôt pour un célibataire sans enfant",
     expected: {doc_id: impots_classes, sections: [impots_classes#s1], lines: [2, 6]}}
