[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guide-rag"
version = "0.1.0"
description = "A documentary chatbot over a public guide for newcomers to Luxembourg, built brick by brick: document parsing, question parsing, retrieval by filtering, typed generation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "pydantic>=2.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guide-rag = "guide_rag.cli:main"

[tool.setuptools.packages.find]
include = ["guide_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
