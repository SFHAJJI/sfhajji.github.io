    title: Assurer son véhicule
    reviewed: true
    summary_line: 'Assurer sa voiture, obligatoire avant de l''immatriculer, et faire valoir son historique de conducteur.
      Le lecteur dit : assurance auto, bonus, malus, relevé d''information, franchise, prix, jeune conducteur ;
      la page dit : responsabilité civile obligatoire, attestation d''assurance, certificat bonus-malus (relevé
      d''information en France, attestation de sinistralité en Belgique), degré neutre de l''échelle, conducteur
