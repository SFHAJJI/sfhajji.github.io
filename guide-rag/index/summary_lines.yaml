    title: Les huit premiers jours
    reviewed: true
    summary_line: 'La déclaration d''arrivée à la commune, première démarche de tout nouvel arrivant, dans les huit
      jours. Le lecteur dit : arriver, s''inscrire, mairie, Biergercenter, enregistrement, matricule, premiers jours
