# Abbreviations a newcomer types and the words the guide uses for them.
# Matched as whole tokens, case-insensitive, accents ignored. The expansion replaces the token in
# corrected_question; the abbreviation itself stays a keyword variant in keywords.yaml, so retrieval
# still finds the lines that use the short form. One expansion per abbreviation: when a short form
# is ambiguous the most frequent meaning in a newcomer guide wins and the note says which.
abbreviations:
  - abbreviation: rc
    expansion: responsabilité civile
    language: fr
    note: civil liability insurance; the guide also writes "RC"
  - abbreviation: cns
    expansion: caisse nationale de santé
    language: fr
    note: the public health insurer
  - abbreviation: ccss
    expansion: centre commun de la sécurité sociale
    language: fr
    note: the social security registration office
  - abbreviation: adem
    expansion: agence pour le développement de l'emploi
    language: fr
    note: the employment agency
  - abbreviation: ct
    expansion: contrôle technique
    language: fr
    note: the vehicle inspection; "CT" rarely means anything else in a newcomer guide
  - abbreviation: snca
    expansion: société nationale de circulation automobile
    language: fr
    note: registers vehicles and issues licences
  - abbreviation: snct
    expansion: contrôle technique
    language: fr
    note: former name of the inspection body, still typed by readers
  - abbreviation: cfl
    expansion: chemins de fer luxembourgeois
    language: fr
    note: the railway company
  - abbreviation: inl
    expansion: institut national des langues
    language: fr
    note: public language courses
  - abbreviation: ssm
    expansion: salaire social minimum
    language: fr
    note: the minimum wage
  - abbreviation: cdi
    expansion: contrat à durée indéterminée
    language: fr
    note: permanent employment contract
  - abbreviation: cdd
    expansion: contrat à durée déterminée
    language: fr
    note: fixed-term employment contract
  - abbreviation: edl
    expansion: état des lieux
    language: fr
    note: the move-in / move-out inspection report
  - abbreviation: tva
    expansion: taxe sur la valeur ajoutée
    language: fr
    note: VAT
  - abbreviation: vat
    expansion: value added tax
    language: en
    note: VAT
  - abbreviation: id
    expansion: carte d'identité
    language: fr
    note: readers type "ID" for the identity card
  - abbreviation: nif
    expansion: numéro d'identification nationale
    language: fr
    note: the 13-digit national number, also called matricule
  - abbreviation: ssn
    expansion: social security number
    language: en
    note: the matricule, in English
  - abbreviation: tüv
    expansion: contrôle technique
    language: de
    note: German readers call the inspection by its German body's name
  - abbreviation: kfz
    expansion: fahrzeug
    language: de
    note: German abbreviation for a motor vehicle
