# The expert dictionary, level 1: one row per concept of a newcomer-to-Luxembourg guide.
# Topics are the closed list of SPEC §1 (housing, vehicle, liability, administration, health, work,
# money, other) so that `scope_filters.topic` compares with `corpus_index.topic` directly.
# Variants per language live in keywords.yaml; why each row exists is in CHANGELOG.md.
