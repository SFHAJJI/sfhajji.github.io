# Weak words: generic verbs and nouns that never identify a topic on their own.
# The question parser keeps them as keywords (source direct) but with weight 0.3 and `weak: true`,
# so retrieval can read the same list and never let "obtenir" or "documents" decide a section.
# Matched by stem (plural and feminine endings ignored), accent-folded. A question made only of
# weak words has no subject and gets the no_content_words clarification.
# Interrogatives listed here (comment, how, where) are also stop words and never become keywords.
